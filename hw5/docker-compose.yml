# Common attributes for Airflow services.
x-airflow-common-service: &airflow-common-service
  build:
    context: "./airflow"
    dockerfile: "./Dockerfile"
    args:
      AIRFLOW__IMAGE__TAG: "${HA5__AIRFLOW__IMAGE__TAG}"
  environment: &airflow-common-environment
    AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "${HA5__AIRFLOW__DATABASE__URI}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${HA5__AIRFLOW__API__JWT_SECRET}"
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - "./airflow/dags:/opt/airflow/dags"
    - "./airflow/logs:/opt/airflow/logs"
    - "./airflow/config:/opt/airflow/config"
    - "./airflow/plugins:/opt/airflow/plugins"
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: "service_healthy"
  networks:
    - "private"

services:
  # ------------ MINIO ------------

  # S3-compatible store designed for
  # storing synthetic data in CSV
  # format for each table from the task.
  minio:
    image: "quay.io/minio/minio:${HA5__MINIO__IMAGE__TAG}"
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      - "MINIO_ROOT_USER=${HA5__MINIO__USER}"
      - "MINIO_ROOT_PASSWORD=${HA5__MINIO__PASSWORD}"
    volumes:
      - "minio:/data"
    ports:
      - "127.0.0.1:${HA5__MINIO__LOCAL_PORT}:9001"
    networks:
      - "private"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------- AIRFLOW -----------

  # PostgreSQL database designed for
  # storing Airflow data.
  airflow-postgres:
    image: "postgres:${HA5__AIRFLOW__POSTGRES__IMAGE__TAG}"
    environment:
      - "POSTGRES_DB=${HA5__AIRFLOW__POSTGRES__DB}"
      - "POSTGRES_USER=${HA5__AIRFLOW__POSTGRES__USER}"
      - "POSTGRES_PASSWORD=${HA5__AIRFLOW__POSTGRES__PASSWORD}"
    volumes:
      - "airflow-postgres:/var/lib/postgresql/data"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${HA5__AIRFLOW__POSTGRES__DB}"]
      interval: "10s"
      retries: 5
      start_period: "5s"

  # Initializes Airflow, e.g. changes
  # ownership of files in shared volumes,
  # downloads necessary Airflow plugins,
  # creates necessary tables in the database.
  airflow-init:
    <<: *airflow-common-service
    entrypoint: "/bin/bash"
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: true
      _AIRFLOW_WWW_USER_CREATE: true
      _AIRFLOW_WWW_USER_USERNAME: "${HA5__AIRFLOW__USER}"
      _AIRFLOW_WWW_USER_PASSWORD: "${HA5__AIRFLOW__PASSWORD}"
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    user: "0:0"

  # Serves Airflow API (including web inteface) for
  # users, workers, and others who need it.
  airflow-api:
    <<: *airflow-common-service
    command: "api-server"
    environment:
      <<: *airflow-common-environment
      AIRFLOW__API_BASE_URL: "${HA5__AIRFLOW__LOCAL_BASE_URL}"
    ports:
      - "127.0.0.1:${HA5__AIRFLOW__LOCAL_PORT}:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: "service_completed_successfully"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--insecure",
          "https://localhost:8080/api/v2/version",
        ]
      interval: "30s"
      timeout: "10s"
      retries: 5
      start_period: "30s"

  # Sheduler orchestrates workers to handle
  # the tasks that need to be run in the
  # configured sequence.
  airflow-scheduler:
    <<: *airflow-common-service
    command: "scheduler"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: "30s"
      timeout: "10s"
      retries: 5
      start_period: "30s"
    restart: "always"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: "service_completed_successfully"

  # Constantly parses DAG files, keeping the
  # DAG bag fresh. This service automaticaly
  # syncronizes local DAGs version with the
  # one shown in the UI, i.e. server version.
  airflow-dag-processor:
    <<: *airflow-common-service
    command: "dag-processor"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: "30s"
      timeout: "10s"
      retries: 5
      start_period: "30s"
    restart: "always"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: "service_completed_successfully"

  # ------- HIVE METASTORE --------

  # PostgreSQL database designed for storing
  # Hive metastore data.
  hive-metastore-postgres:
    image: "postgres:${HA5__HIVE_METASTORE__POSTGRES__IMAGE__TAG}"
    environment:
      - "POSTGRES_DB=${HA5__HIVE_METASTORE__POSTGRES__DB}"
      - "POSTGRES_USER=${HA5__HIVE_METASTORE__POSTGRES__USER}"
      - "POSTGRES_PASSWORD=${HA5__HIVE_METASTORE__POSTGRES__PASSWORD}"
    volumes:
      - "hive-metastore-postgres:/var/lib/postgresql/data"
    networks:
      - "private"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${HA5__HIVE_METASTORE__POSTGRES__DB}"]
      interval: "10s"
      retries: 5
      start_period: "5s"

  # Hive metastore stores information about
  # the tables, schemas, and other entities
  # that exist in the system. It is used by
  # Spark to store the tables metadata.
  hive-metastore:
    build:
      context: "./hive-metastore"
      dockerfile: "./Dockerfile"
      args:
        - "HIVE_METASTORE__IMAGE__TAG=${HA5__HIVE_METASTORE__IMAGE__TAG}"
    environment:
      - "SERVICE_NAME=metastore"
      - "DB_DRIVER=postgres"
      - "SERVICE_OPTS=-Dhive.metastore.warehouse.dir=file:/opt/hive/data/warehouse"
    depends_on:
      hive-metastore-postgres:
        condition: "service_healthy"
    networks:
      - "private"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9083'"]
      interval: 15s
      timeout: 5s
      retries: 15

  # ------- SPARK CLUSTER ---------

  # Spark master node.
  spark-master:
    image: "apache/spark:${HA5__SPARK__IMAGE__TAG}"
    container_name: "spark-master"
    hostname: "spark-master"
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"
    environment:
      - "SPARK_MODE=master"
      - "SPARK_MASTER_HOST=spark-master"
      - "SPARK_MASTER_PORT=7077"
      - "SPARK_MASTER_WEBUI_PORT=8080"
    ports:
      - "127.0.0.1:${HA5__SPARK__UI__LOCAL_PORT}:8080"
    volumes:
      - "./spark/logs:/opt/spark/logs"
      - "./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro"
    networks:
      - "private"
    depends_on:
      hive-metastore:
        condition: "service_healthy"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/spark-master/7077'"]
      interval: 15s
      timeout: 5s
      retries: 15

  # Spark worker node.
  spark-worker:
    image: "apache/spark:${HA5__SPARK__IMAGE__TAG}"
    container_name: "spark-worker"
    hostname: "spark-worker"
    command: "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    environment:
      - "SPARK_MODE=worker"
      - "SPARK_WORKER_CORES=2"
      - "SPARK_WORKER_MEMORY=2g"
      - "SPARK_WORKER_WEBUI_PORT=8081"
    ports:
      - "127.0.0.1:${HA5__SPARK__WORKER__UI__LOCAL_PORT}:8081"
    volumes:
      - "./spark/config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro"
    networks:
      - "private"
    depends_on:
      spark-master:
        condition: "service_healthy"

  # ------------ TRINO ------------

  # TODO

networks:
  private: {}

volumes:
  minio: {}
  airflow-postgres: {}
  hive-metastore-postgres: {}
