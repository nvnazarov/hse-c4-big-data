# Iceberg configuration.
spark.sql.catalog.demo=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type=hadoop
spark.sql.catalog.demo.warehouse=s3a://warehouse/
spark.sql.catalog.demo.io-impl=org.apache.iceberg.aws.s3.S3FileIO

# MinIO configuration.
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minio-user
spark.hadoop.fs.s3a.secret.key=minio-password
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Hive Metastore configuration.
spark.sql.catalogImplementation=hive
spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-postgres:5432/postgres
spark.hadoop.javax.jdo.option.ConnectionDriverName=org.postgresql.Driver
spark.hadoop.javax.jdo.option.ConnectionUserName=postgres
spark.hadoop.javax.jdo.option.ConnectionPassword=postgres

# Spark SQL configuration.
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.shuffle.partitions=10
spark.sql.adaptive.enabled=true